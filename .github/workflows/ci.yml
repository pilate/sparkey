name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    name: build (${{ matrix.cc }})
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake pkg-config libsnappy-dev libzstd-dev

      - name: Configure
        run: cmake -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DSPARKEY_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitize:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    name: sanitize (${{ matrix.cc }})
    env:
      SAN_FLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake pkg-config libsnappy-dev libzstd-dev

      - name: Configure
        run: >-
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_C_FLAGS="$SAN_FLAGS"
          -DCMAKE_EXE_LINKER_FLAGS="$SAN_FLAGS"
          -DCMAKE_SHARED_LINKER_FLAGS="$SAN_FLAGS"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  debian:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-13
            image: debian:13
          - name: debian-12
            image: debian:12
            distribution: bookworm
            version_suffix: "~deb12"
          - name: ubuntu-24.04
            image: ubuntu:24.04
            distribution: noble
            version_suffix: "~ubuntu24.04"
    container: ${{ matrix.image }}
    name: package (${{ matrix.name }})
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates dpkg-dev lintian

      - uses: actions/checkout@v4

      # Give each distribution's packages a distinct version, so they can be
      # published side by side. "~" sorts before the release, so the plain
      # version replaces these after a distribution upgrade.
      - name: Set distribution and version
        if: matrix.distribution
        run: >-
          sed -i "1s/^\([^ ]*\) (\([^)]*\)) [^;]*;/\1 (\2${{ matrix.version_suffix }}) ${{ matrix.distribution }};/"
          debian/changelog

      - name: Install build dependencies
        run: apt-get build-dep -y ./

      - name: Build packages
        run: dpkg-buildpackage -us -uc -b

      - name: Lintian
        run: lintian --fail-on error,warning ../*.changes

      # Ubuntu puts debug symbols in .ddeb files instead of -dbgsym .debs.
      - name: Collect packages
        run: |
          mkdir dist
          find .. -maxdepth 1 -type f \( -name '*.deb' -o -name '*.ddeb' -o -name '*.changes' -o -name '*.buildinfo' \) -exec mv -t dist {} +

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: dist/
